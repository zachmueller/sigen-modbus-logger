<!DOCTYPE html>
<!--
  The live view: the last five minutes, scrolling, a point every two seconds.

  Served as the extensionless /live entry point by SigenSite (see site-stack.ts), and only
  once SigenLive exists. Public or gated by cloud.json's live_public -- the page does not know
  or care which; when it is gated, the edge does the gating.

  It shares the archive viewer's stylesheet, palette and chart primitives (charts.js) so a
  live chart reads like an archive chart, and adds only its own files: livechart.js (the
  stream and the scrolling chart), live.js (this page) and the vendored MQTT client.
-->
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Live household load says whether anyone is home. Not for search engines. -->
<meta name="robots" content="noindex, nofollow">
<title>SigenStor live</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/live.css">
</head>
<body class="viz-root live-page" data-state="loading">
<header class="topbar">
  <div class="brand">
    <h1>SigenStor live</h1>
    <p class="sub">The last five minutes, as the logger reads it. <a href="/">About</a></p>
  </div>
  <span class="pill" id="status"><span class="dot"></span><span id="status-text">starting</span></span>
</header>
<main>
  <div id="notice" class="notice" hidden></div>
  <section id="charts" class="live-grid" aria-live="off"></section>
  <footer class="card-foot live-foot">
    <div class="legend" id="legend">
      <span class="item"><span class="swatch box key-nodata"></span>inverter not answering — the logger is running and probing it</span>
      <span class="item"><span class="swatch box key-norecords"></span>no live data — nothing reached the cloud</span>
    </div>
    <div class="hint" id="clock-note"></div>
  </footer>
</main>
<script src="/charts.js"></script>
<script src="/vendor/mqtt.min.js"></script>
<script src="/livechart.js"></script>
<script src="/live.js"></script>
</body>
</html>
